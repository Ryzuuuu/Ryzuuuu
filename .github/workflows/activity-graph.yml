name: Generate Activity Graph

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity-graph.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/activity_graph.py --user "${{ github.repository_owner }}" --out activity-graph.svg

      - name: Commit activity-graph.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update activity-graph.svg"
            git pull --rebase origin main
            git push
          fi
