<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#6d28d9">
        <animate attributeName="stop-color" values="#6d28d9;#7c3aed;#6d28d9" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9;#38bdf8;#0ea5e9" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="roundedClip">
      <rect x="0" y="0" width="1200" height="300" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedClip)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bgGrad)"/>

    <!-- floating particles -->
    <circle cx="120" cy="60" r="3" fill="url(#dotGlow)">
      <animate attributeName="cy" values="60;230;60" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="220" r="2.5" fill="url(#dotGlow)">
      <animate attributeName="cy" values="220;40;220" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="50" r="3" fill="url(#dotGlow)">
      <animate attributeName="cy" values="50;240;50" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="200" r="2" fill="url(#dotGlow)">
      <animate attributeName="cy" values="200;30;200" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="180" r="2" fill="url(#dotGlow)">
      <animate attributeName="cy" values="180;20;180" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="120" r="2.5" fill="url(#dotGlow)">
      <animate attributeName="cy" values="120;270;120" dur="9.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9.5s" repeatCount="indefinite"/>
    </circle>

    <!-- name -->
    <text x="600" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">
      Neelabja Mukhopadhyay
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>

    <!-- tagline -->
    <text x="600" y="185" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="600" fill="#e0e7ff" opacity="0.95">
      AI/ML &#8226; Web Development &#8226; Competitive Programming
      <animate attributeName="opacity" values="0;0.95" dur="1.6s" fill="freeze"/>
    </text>

    <!-- underline accent -->
    <rect x="470" y="205" width="260" height="3" rx="1.5" fill="#ffffff" opacity="0.6">
      <animate attributeName="width" values="0;260" dur="1.4s" fill="freeze"/>
      <animate attributeName="x" values="600;470" dur="1.4s" fill="freeze"/>
    </rect>

    <!-- bottom wave -->
    <path fill="#020617" opacity="0.35">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="
          M0,300 L0,255 Q300,230 600,255 T1200,255 L1200,300 Z;
          M0,300 L0,260 Q300,285 600,260 T1200,260 L1200,300 Z;
          M0,300 L0,255 Q300,230 600,255 T1200,255 L1200,300 Z" />
    </path>
  </g>
</svg>
