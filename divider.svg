<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" role="img" aria-label="Section divider">
<title>Section divider</title>
<defs>
<linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#6d28d9"/>
<stop offset=".5" stop-color="#0ea5e9"/>
<stop offset="1" stop-color="#6d28d9"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="500 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/>
<stop offset=".2" stop-color="#fff" stop-opacity="1"/>
<stop offset=".8" stop-color="#fff" stop-opacity="1"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<mask id="edge" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="20">
<rect width="1000" height="20" fill="url(#fade)"/>
</mask>
<linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="1" stop-color="#e0f2fe" stop-opacity="1"/>
</linearGradient>
<filter id="glow" x="-20%" y="-400%" width="140%" height="900%">
<feGaussianBlur stdDeviation="2.6"/>
</filter>
<filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
<feGaussianBlur stdDeviation="3"/>
</filter>
</defs>
<g mask="url(#edge)">
<rect x="0" y="8" width="1000" height="4" rx="2" fill="url(#flow)" opacity=".5" filter="url(#glow)"/>
<rect x="0" y="9" width="1000" height="2" rx="1" fill="url(#flow)"/>
<rect x="-170" y="8.7" width="170" height="2.6" rx="1.3" fill="url(#comet)">
<animate attributeName="x" from="-170" to="1000" dur="4.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1"/>
</rect>
</g>
<g transform="translate(500 10)">
<circle r="9" fill="#6d28d9" opacity=".3" filter="url(#soft)">
<animate attributeName="opacity" values=".12;.55;.12" dur="3s" repeatCount="indefinite"/>
</circle>
<rect x="-3.6" y="-3.6" width="7.2" height="7.2" rx="1.2" fill="#e0e7ff" transform="rotate(45)">
<animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="9s" repeatCount="indefinite"/>
</rect>
<circle cx="-24" r="1.7" fill="#38bdf8"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="24" r="1.7" fill="#a78bfa"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="-40" r="1.1" fill="#38bdf8" opacity=".6"><animate attributeName="opacity" values=".15;.8;.15" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="40" r="1.1" fill="#a78bfa" opacity=".6"><animate attributeName="opacity" values=".8;.15;.8" dur="3.2s" repeatCount="indefinite"/></circle>
</g>
</svg>
