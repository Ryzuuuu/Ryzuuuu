<svg width="420" height="260" viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="400" height="240" rx="14" fill="url(#winGrad)" stroke="#6d28d9" stroke-opacity="0.4"/>

  <rect x="10" y="10" width="400" height="34" rx="14" fill="#1e1b4b"/>
  <rect x="10" y="30" width="400" height="14" fill="#1e1b4b"/>
  <circle cx="32" cy="27" r="6" fill="#ef4444"/>
  <circle cx="52" cy="27" r="6" fill="#f59e0b"/>
  <circle cx="72" cy="27" r="6" fill="#22c55e"/>
  <text x="210" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">ryzuuuu@dev: ~</text>

  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <text x="28" y="80" fill="#38bdf8">$ <tspan fill="#e2e8f0">whoami</tspan></text>
    <text x="28" y="102" fill="#c4b5fd" opacity="0">
      neelabja_mukhopadhyay
      <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="28" y="130" fill="#38bdf8" opacity="0">
      $ <tspan fill="#e2e8f0">status</tspan>
      <animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="28" y="152" fill="#4ade80" opacity="0">
      building FuelFlux + TriSense
      <animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="28" y="180" fill="#38bdf8" opacity="0">
      $ <tspan fill="#e2e8f0">ship --now</tspan>
      <animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="28" y="202" fill="#fbbf24" opacity="0">
      done. make it beautiful next.
      <animate attributeName="opacity" values="0;1" begin="2.9s" dur="0.4s" fill="freeze"/>
    </text>

    <rect x="28" y="212" width="9" height="16" fill="#6d28d9" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0;1" begin="3.3s" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
