<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="02 Tech stack">
<title>02 Tech stack</title>
<defs>
<linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
<linearGradient id="tt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#e2e8f0"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#e2e8f0"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="320 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="254" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/><stop offset=".6" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
<filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="6" y="10" width="46" height="46" rx="13" fill="url(#chip)"/>
<rect x="6" y="10" width="46" height="46" rx="13" fill="none" stroke="#fff" stroke-opacity=".25"/>
<text x="29" y="40" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="800" fill="#fff">02</text>
<rect x="6" y="10" width="46" height="46" rx="13" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;.22;0" dur="4s" repeatCount="indefinite"/></rect>
<text x="78" y="38" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" fill="url(#tt)" textLength="154.0" lengthAdjust="spacingAndGlyphs">Tech stack</text>
<text x="79" y="56" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="1.5" fill="#64748b">// tools i actually reach for</text>
<rect x="254" y="31" width="740" height="2" rx="1" fill="url(#ln)"/>
<circle r="3.2" cy="32" fill="#e0f2fe" filter="url(#g)"><animate attributeName="cx" values="254;960" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".4 0 .2 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="5s" repeatCount="indefinite"/></circle>
<path d="M246,32 l5,-5 l5,5 l-5,5 Z" fill="#a78bfa" opacity=".9"/>
</svg>